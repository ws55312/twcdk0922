# ========== 取号队列 ==========

class ClaimQueue:
    """取号队列：严格串行，同一时间只有一个线程在取号（含网络往返）；出错暂停30s"""

    def __init__(self, pause_on_error=30):
        self._lock = threading.Lock()
        self._pause_on_error = pause_on_error
        self._paused_until = 0.0

    def acquire(self):
        """获取取号锁，阻塞直到轮到本线程且不在暂停期"""
        while True:
            self._lock.acquire()
            now = time.time()
            if now >= self._paused_until:
                return
            wait = self._paused_until - now
            self._lock.release()
            time.sleep(min(wait, 1.0))

    def release(self):
        """释放取号锁，允许下一个线程取号"""
        self._lock.release()

    def report_error(self, status_code=None, is_timeout=False):
        """上报取号错误，触发暂停（须在持有锁时调用）"""
        self._paused_until = time.time() + self._pause_on_error
        if status_code:
            reason = f"HTTP {status_code}"
        elif is_timeout:
            reason = "连接超时"
        else:
            reason = "未知错误"
        print(f"[取号队列] 检测到错误({reason})，暂停取号 {self._pause_on_error}s")


# 全局取号队列实例
claim_queue = ClaimQueue(pause_on_error=CLAIM_QUEUE_PAUSE)


