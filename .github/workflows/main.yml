def parse_m3u8_segments(m3u8_content, base_url):
    segments = []
    for line in m3u8_content.strip().split("\n"):
        line = line.strip()
        if line and not line.startswith("#"):
            segments.append(line if line.startswith("http") else urljoin(base_url, line))
    return segments


def select_best_quality_playlist(master_m3u8, base_url):
    best_url, best_bandwidth, current_bandwidth = None, 0, 0
    for line in master_m3u8.strip().split("\n"):
        line = line.strip()
        if line.startswith("#EXT-X-STREAM-INF"):
            m = re.search(r"BANDWIDTH=(\d+)", line)
            if m:
                current_bandwidth = int(m.group(1))
        elif line and not line.startswith("#"):
            if current_bandwidth > best_bandwidth:
                best_bandwidth = current_bandwidth
                best_url = line if line.startswith("http") else urljoin(base_url, line)
            current_bandwidth = 0
    return best_url


def download_segment(client, url):
    try:
        with client.stream("GET", url, timeout=15) as resp:
            size = 0
            for chunk in resp.iter_bytes(chunk_size=8192):
                size += len(chunk)
            return size
    except Exception:
        return 0


