# ========== Spade 事件上报（推动挂宝进度的关键） ==========

def send_spade_events(client, auth_token, device_id, client_integrity,
                       channel_name, channel_id, play_session_id,
                       tab_session_id, app_session_id, seconds_watched,
                       user_login, user_id,
                       stream_game_name="Minecraft", stream_game_id="27471",
                       broadcast_id="316005031922"):
    """发送 Spade 事件告诉 Twitch 你正在观看直播"""

    event = {
        "event": "minute-watched",
        "properties": {
            "broadcast_id": str(broadcast_id),
            "channel_id": str(channel_id),
            "channel": channel_name,
            "client_time": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%S.") + f"{random.randint(100, 999)}Z",
            "game": stream_game_name,
            "game_id": str(stream_game_id),
            "hidden": False,
            "is_live": True,
            "live": True,
            "logged_in": True,
            "minutes_logged": 1,
            "muted": False,
            "user_id": user_id,
        }
    }

    events_json = json.dumps([event], separators=(",", ":"))
    compressed = gzip.compress(events_json.encode())
    b64 = base64.b64encode(compressed).decode()

    ops = [{
        "query": "\n  mutation SendEvents($input: SendSpadeEventsInput!) {\n    sendSpadeEvents(input: $input) {\n      statusCode\n    }\n  }\n",
        "variables": {
            "input": {
                "data": b64,
                "repository": "twilight",
                "encoding": "GZIP_B64"
            }
        }
    }]
    result = gql_request(client, auth_token, device_id, client_integrity, ops)
    if result and len(result) > 0:
        return result[0].get("data", {}).get("sendSpadeEvents", {}).get("statusCode")
    return None


