def mask_cdk(code):
    if not code or len(code) <= 10:
        return "***"
    return code[:5] + "***" + code[-5:]


# ========== Cookie 转换 ==========

def convert_cookie(cookie):
    new_cookie = {
        "name": cookie.get("name"),
        "value": cookie.get("value"),
        "domain": cookie.get("domain"),
        "path": cookie.get("path", "/"),
        "httpOnly": cookie.get("httpOnly", False),
        "secure": cookie.get("secure", False),
    }
    expires = cookie.get("expires")
    if expires is not None and expires != -1:
        new_cookie["expirationDate"] = expires
    same_site = cookie.get("sameSite", "unspecified")
    if same_site == "None":
        new_cookie["sameSite"] = "no_restriction"
    elif same_site == "Lax":
        new_cookie["sameSite"] = "lax"
    elif same_site == "Strict":
        new_cookie["sameSite"] = "strict"
    else:
        new_cookie["sameSite"] = "unspecified"
    return new_cookie


def convert_cookies(cookies_data):
    if isinstance(cookies_data, str):
        cookies_data = json.loads(cookies_data)
    return [convert_cookie(c) for c in cookies_data]


def extract_cookie_values(raw_cookies):
    auth_token = None
    unique_id = None
    user_login = None
    user_id = None
    for c in raw_cookies:
        if c["name"] == "auth-token":
            auth_token = c["value"]
        elif c["name"] == "unique_id":
            unique_id = c["value"]
        elif c["name"] == "twilight-user":
            try:
                import urllib.parse
                decoded = urllib.parse.unquote(c["value"])
                data = json.loads(decoded)
                user_login = data.get("login", "")
                user_id = data.get("id", "")
            except Exception:
                pass
    return auth_token, unique_id, user_login, user_id


def get_client_integrity(client, auth_token, device_id):
    resp = client.post(INTEGRITY_URL, json={}, headers={
        "Authorization": f"OAuth {auth_token}",
        "Client-Id": CLIENT_ID,
        "x-device-id": device_id,
        "Client-Version": CLIENT_VERSION,
        "Client-Session-Id": device_id[:16],
        "Referer": "https://www.twitch.tv/",
    }, timeout=30)
    if resp.status_code == 401:
        return None  # 明确返回 None 表示认证失败
    return resp.json().get("token", "")


def gql_request(client, auth_token, device_id, client_integrity, operations):
    headers = {
        "Authorization": f"OAuth {auth_token}",
        "Client-Id": CLIENT_ID,
        "x-device-id": device_id,
        "Client-Version": CLIENT_VERSION,
        "Client-Session-Id": device_id[:16],
        "Content-Type": "application/json",
    }
    if client_integrity:
        headers["Client-Integrity"] = client_integrity
    resp = client.post(GQL_URL, json=operations, headers=headers, timeout=60)
    if resp.status_code != 200:
        return None
    return resp.json()


def gql_request_raw(client, auth_token, device_id, client_integrity, operations):
    """同 gql_request，但返回 (json_data, status_code) 以便检测 401"""
    headers = {
        "Authorization": f"OAuth {auth_token}",
        "Client-Id": CLIENT_ID,
        "x-device-id": device_id,
        "Client-Version": CLIENT_VERSION,
        "Client-Session-Id": device_id[:16],
        "Content-Type": "application/json",
    }
    if client_integrity:
        headers["Client-Integrity"] = client_integrity
    resp = client.post(GQL_URL, json=operations, headers=headers, timeout=60)
    try:
        return resp.json(), resp.status_code
    except Exception:
        return None, resp.status_code


