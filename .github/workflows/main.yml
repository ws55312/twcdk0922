def api_headers():
    return {
        "Authorization": f"Bearer {API_AUTH_TOKEN}",
        "X-Worker-Id": WORKER_ID,
        "Content-Type": "application/json",
    }


def fetch_idle_account(api_client):
    """从后端获取空闲账号（严格串行：上一个取完，下一个才取）"""
    for attempt in range(3):
        claim_queue.acquire()
        try:
            resp = api_client.get(f"{BASE_URL}/api/accounts/get_idle", headers=api_headers(), timeout=30)
            if resp.status_code == 500:
                claim_queue.report_error(status_code=500)
                continue
            if resp.status_code == 404:
                return None
            data = resp.json()
            if data.get("code") == 0:
                return data.get("data", {})
        except (httpx.TimeoutException, httpx.ConnectTimeout, httpx.ReadTimeout):
            claim_queue.report_error(is_timeout=True)
        except Exception as e:
            print(f"  [!] 获取空闲账号失败 (尝试 {attempt+1}/3): {e}")
        finally:
            claim_queue.release()
        if attempt < 2:
            time.sleep(3)
    return None


