def follow_channel(auth_token, device_id, channel_id):
    """关注直播间。成功（含已关注）返回 ""，失败返回原因

    配方来自已验证实现，缺一项都会被 Twitch 拒：
      1) 取 integrity 令牌时必须带 X-Device-Id，才拿到设备绑定令牌；
         不带则拿到设备无关的低信任令牌，调 gql 必被 IntegrityCheckFailed 拒
      2) 关注请求带 X-Device-Id + Client-Integrity，走网页端同款持久化查询 hash
      3) 不带 cookie（网页端该请求是 credentials:'omit'）
      4) 只用官方 /integrity 端点发的令牌，伪造的会被判机器人
    部分账号会被下发 challenge-gates（kind=phone-verification），是账号级关卡，由调用方跳过。
    """
    base = {"Client-Id": CLIENT_ID, "X-Device-Id": device_id}
    integrity = ""
    try:
        with httpx.Client(headers={"User-Agent": USER_AGENT}, verify=False, timeout=30) as c:
            try:
                r = c.post(INTEGRITY_URL, json={},
                           headers=dict(base, Authorization=f"OAuth {auth_token}"))
                integrity = (r.json() or {}).get("token", "") or ""
            except Exception:
                pass
            headers = dict(base, Authorization=f"OAuth {auth_token}",
                           **{"Content-Type": "application/json"})
            if integrity:
                headers["Client-Integrity"] = integrity
            body = [{
                "operationName": "FollowButton_FollowUser",
                "variables": {"input": {"disableNotifications": False, "targetID": str(channel_id)}},
                "extensions": {"persistedQuery": {"version": 1, "sha256Hash": FOLLOW_QUERY_HASH}},
            }]
            resp = c.post(GQL_URL, json=body, headers=headers, timeout=30)
    except Exception as e:
        return f"请求异常: {e}"

    tag = f"integrity={len(integrity)}"
    if resp.status_code == 401:
        return f"Cookie 失效(401)"
    try:
        data = resp.json()
    except Exception:
        return f"返回非 JSON(http={resp.status_code})"
    item = data[0] if isinstance(data, list) and data else (data if isinstance(data, dict) else {})
    payload = (item.get("data") or {}).get("followUser") or {}
    if payload.get("follow"):
        return ""
    err = payload.get("error") or {}
    code = str(err.get("code") or "").upper()
    if "ALREADY" in code:
        return ""  # 已关注按成功处理（幂等）
    if err:
        return f"{code} {tag}"
    errors = item.get("errors")
    if errors:
        msg = json.dumps(errors, ensure_ascii=False)
        kind = str(((item.get("extensions") or {}).get("challenge") or {}).get("kind") or "").strip()
        if kind:
            return f"需要验证({kind}) {tag}"
        if "requires challenge" in msg:
            return f"需要验证(requires challenge) {tag}"
        if "integrity" in msg.lower():
            return f"integrity 校验失败 {tag}"
        return f"接口报错: {msg[:150]}"
    return f"未知返回 {tag}"


def get_playback_access_token(client, auth_token, device_id, client_integrity, channel_name):
    ops = [{
        "operationName": "PlaybackAccessToken_Template",
        "query": 'query PlaybackAccessToken_Template($login: String!, $isLive: Boolean!, $vodID: ID!, $isVod: Boolean!, $playerType: String!, $platform: String!) { streamPlaybackAccessToken(channelName: $login, params: {platform: $platform, playerBackend: "mediaplayer", playerType: $playerType}) @include(if: $isLive) { value signature authorization { isForbidden forbiddenReasonCode } __typename } videoPlaybackAccessToken(id: $vodID, params: {platform: $platform, playerBackend: "mediaplayer", playerType: $playerType}) @include(if: $isVod) { value signature __typename } }',
        "variables": {"isLive": True, "login": channel_name, "isVod": False, "vodID": "", "playerType": "site", "platform": "web"},
    }]
    result = gql_request(client, auth_token, device_id, client_integrity, ops)
    if result and len(result) > 0:
        access_data = result[0].get("data", {}).get("streamPlaybackAccessToken", {})
        return access_data.get("value"), access_data.get("signature")
    return None, None


